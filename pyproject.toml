[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "venv", "chroma_db", ".git", "__pycache__", "data", "build", "dist"]
python_files = ["test_*.py"]
addopts = "-ra -q --ignore=venv --ignore=.venv"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

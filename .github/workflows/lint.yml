name: Lint & Code Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff Linter & Formatter Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

name: RAG Evaluation Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RAG Evaluation Benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-mock-key' }}
          GROQ_MODEL: llama-3.1-8b-instant
        run: |
          python -m src.evaluate --pdf data/financial_report.pdf --output benchmark_report.json

      - name: Upload Benchmark Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: benchmark_report.json
          retention-days: 14
